[server]
headless = true
fileWatcherType = "none"
maxUploadSize = 50          # MB — όριο αρχείου Excel (όσο και το Supabase Storage free plan)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
# Πλήρως ορισμένο ανοιχτό θέμα: υψηλή αντίθεση ανεξάρτητα από το (σκοτεινό) θέμα του υπολογιστή.
base = "light"
primaryColor = "#15803d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#111827"
