name: OneDrive mirror and transfer safety
on:
  push:
    branches:
      - claude/focused-darwin-fivuu3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run OneDrive mirror regression tests (SQLite + synthetic Excel only)
        run: |
          python -m pytest -q \
            tests/test_onedrive_outbox.py \
            tests/test_onedrive_sync.py \
            tests/test_onedrive_upload_url.py \
            tests/test_onedrive_diff.py \
            tests/test_onedrive_reconcile.py \
            tests/test_transfer.py
